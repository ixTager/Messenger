<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Chat</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    </head>

    <body>
        <div>
            <div>
                <ul th:each="dialog : ${dialogs}">
                    <li>
                        <a th:href="@{/chats(dialogId=${dialog.getId})}" th:text="${dialog.getId()}"></a>
                    </li>
                </ul>
            </div>

            <div>
                <ul th:each="message : ${messages}">
                    <li>
                        <p th:text="${message.getSenderName()}"></p>
                        <p th:text="${message.getContent()}"></p>
                        <p th:text="${message.getSentAt()}"></p>
                    </li>
                </ul>
            </div>

            <div>
                <form id="form-message">
                    <input name="message" type="text" placeholder="Your message" id="msg"/>
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const dialogId = urlParams.get('dialogId');

            const form = document.getElementById("form-message");
            const input = document.getElementById("msg");


            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const value = input.value.trim();
                if (!value) {
                    return;
                }
                try {
                    const res = await fetch('/message', {
                        method: "POST",
                        headers: {
                            'Content-Type' : 'application/json'
                        },
                        body: JSON.stringify({
                            dialogId: Number(dialogId),
                            content: value
                        })
                    });
                    if (!res.ok) throw new Error('Server error: ' + res.status);

                    input.value = '';
                }
                catch (err) {
                    console.log("Error of send: " + err);
                }

            });

        </script>
    </body>
</html>
