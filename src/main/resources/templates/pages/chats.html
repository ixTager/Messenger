<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Chat</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    </head>

    <body>
        <div>
            <div>
                <ul id = "dialogs">
                    <li th:each="dialog : ${dialogs}">
                        <a th:href="@{/chats(dialogId=${dialog.getId})}" th:text="${dialog.getId()}"></a>
                    </li>
                </ul>
            </div>

            <div>
                <ul id="messages">
                    <li th:each="message : ${messages}">
                        <p th:text="${message.getSenderName()}"></p>
                        <p th:text="${message.getContent()}"></p>
                        <p th:text="${message.getSentAt()}"></p>
                    </li>
                </ul>
            </div>

            <div>
                <form id="form-message">
                    <input name="message" type="text" placeholder="Your message" id="input-msg"/>
                    <button type="submit" id="sbm-btn">Send</button>
                </form>
            </div>
        </div>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const dialogId = urlParams.get('dialogId');
            const form = document.getElementById("form-message");
            const input = document.getElementById("input-msg");
            const submitBtn = document.getElementById("sbm-btn");
            const messageList = document.getElementById("messages");
            let stompClient = null;

            if (dialogId) {
                const socket = new SockJS('/ws');
                stompClient = Stomp.over(socket);

                stompClient.connect({}, (frame) => {
                    console.log('Connected ' + frame);
                    stompClient.subscribe('/topic/dialog/' + dialogId, (res) => {
                        const input_msg = JSON.parse(res.body);
                        renderNewMsg(input_msg);
                    });
                }, (err) => {
                        console.error("Stomp error: " + err)
                    }
                );

            }
            const renderNewMsg = (message) => {
                const li = document.createElement("li");
                const pSender = document.createElement("p");
                pSender.textContent = message.senderName;

                const pContent = document.createElement("p");
                pContent.textContent = message.content;

                const pTime = document.createElement("p");
                pTime.textContent = message.sentAt;

                li.appendChild(pSender);
                li.appendChild(pContent);
                li.appendChild(pTime);

                messageList.appendChild(li);


            }

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const value = input.value.trim();
                if (!value || dialogId == null) {
                    return;
                }
                submitBtn.disabled = true;

                try {
                    const res = await fetch('/message', {
                        method: "POST",
                        headers: {
                            'Content-Type' : 'application/json'
                        },
                        body: JSON.stringify({
                            dialogId: Number(dialogId),
                            content: value
                        })
                    });
                    if (!res.ok) throw new Error('Server error: ' + res.status);
                    input.value = '';
                }
                catch (err) {
                    console.log("Error of send: " + err);
                }
                submitBtn.disabled = false;
            });

        </script>
    </body>
</html>
