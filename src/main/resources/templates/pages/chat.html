<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Chat [[${uniqueDialogId}]]</title>
        <link rel="stylesheet" th:href="@{/css/chat/common.css}">
        <link rel="stylesheet" th:href="@{/css/chat/chat.css}">
        <link rel="stylesheet" th:href="@{/css/root.css}">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    </head>
    <body th:attr="data-dialog-id=${uniqueDialogId}">
        <div class="chatMainSection">
            <div class="divChats">
                <div class="allDivCurrentUser">
                    <div class="divCurrentUser">
                        <span th:text="${currentUser.firstName}"></span>
                        <span th:text="${currentUser.lastName}"></span>
                    </div>
                    <p th:text="${currentUser.uniqueUserId}"></p>
                </div>

                <input id="inputUniqueUserId" placeholder="Write UniqueUserId to find" type="text" name="uniqueUserId"/>
                <div id="foundedUser"></div>

                <div id="divChatsCurrentUser">
                    <div th:each="dialog : ${dialogs}">
                        <a th:href="@{/chats/{id}(id=${dialog.uniqueDialogId})}">
                            <div class="dialog">
                                <div>
                                    <div>
                                        <span th:text="${dialog.firstNameMember}"></span>
                                        <span th:text="${dialog.lastNameMember}"></span>
                                    </div>

                                    <span th:text="${dialog.lastMessageContent}"></span>
                                </div>

                                <div>
                                    <div>
                                        <div>
                                            <span th:text="${dialog.lastMessageStatus}"></span>
                                            <span th:text="${dialog.sentAtLastMessage}"></span>
                                        </div>
                                    </div>

                                    <div>
                                        <span
                                            th:if="${dialog.countUnreadMessages > 0}"
                                            th:text="${dialog.countUnreadMessages}">
                                        </span>
                                    </div>
                                </div>

                            </div>
                        </a>
                    </div>
                </div>
            </div>

            <div class="messagesMainSection">
                <div>
                    <div>
                        <img src="#" alt="Avatar">
                        <div>
                            <div>
                                <span th:text="${secondUser.firstName}"></span>
                                <span th:text="${secondUser.lastName}"></span>
                            </div>
                            <div id="companion-status">
                                <span th:text="${secondUser.userStatus}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="divMessages"></div>

                <form id="formMessage">
                    <input id="inputMessage" type="text" placeholder="Your message" autocomplete="off"/>
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>

        <script th:inline="javascript">
            const currentUserId = [[${currentUser.uniqueUserId}]];
            const companionUserId = [[${secondUser.uniqueUserId}]];
            const dialogId = [[${uniqueDialogId}]];
        </script>

        <script th:src="@{/js/socket.js}"></script>
        <script th:src="@{/js/getChatsOfCurrentUser.js}"></script>
        <script th:src="@{/js/getMessages.js}"></script>
        <script th:src="@{/js/userStatus.js}"></script>
        <script th:src="@{/js/sendMessage.js}"></script>
        <script th:src="@{/js/chat.js}"></script>
    </body>
</html>
